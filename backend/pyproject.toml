[project]
name = "academy"
version = "0.1.0"
description = "Data Governance Handbook como lecciones interactivas (API)"
authors = [
    { name = "José Ignacio Rodríguez", email = "69468130+joserodriguezc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "faker>=40.43.0",
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlglot>=30.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
academy = "academy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
