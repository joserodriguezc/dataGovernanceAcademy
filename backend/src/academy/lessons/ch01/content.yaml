# Contenido de la lección 1. Texto propio: el libro se referencia, no se reproduce.

intro: >-
  El gobierno de datos no es un fin en sí mismo: existe para que la empresa gane valor con sus
  datos y reduzca el riesgo que hoy le generan. En esta lección preparas el arranque del
  programa de NovaMercado: mides cuánto valen sus datos hoy, justificas la inversión ante el
  comité de dirección, escribes el charter y la política, y montas el cuadro de mando con el
  que se seguirá su implantación.

ideas:
  - idea: "Los datos se pueden valorar como un balance: data equity = activos de datos − pasivos de datos."
    application: "Cada activo (ingresos, horas ahorradas, valor de cliente) y cada pasivo (multas esperadas, horas perdidas, clientes perdidos) de NovaMercado se valora hoy y en la situación objetivo."
  - idea: "Una valoración que el negocio no ha validado no es creíble."
    application: "Las líneas sin «validado por» quedan fuera del caso de negocio conservador."
  - idea: "El caso de negocio sigue una plantilla fija y presenta varias opciones de calendario."
    application: "Se comparan tres opciones (preferida, rápida y lenta) con VAN, ROI y mes de payback."
  - idea: "La visión del programa debe ser breve, memorable y sin jerga técnica."
    application: "Un revisor automático avisa si la visión pasa de 40 palabras o usa términos como «linaje» o «pipeline»."
  - idea: "La misión del programa responde a qué se hace, para quién y cómo."
    application: "Se genera con la plantilla «Desarrollamos X para Y, mediante A, B y C»."
  - idea: "Hay momentos para lanzar y momentos para esperar."
    application: "Se lanza solo si hay al menos un impulsor (regulatorio, petición ejecutiva o de negocio) y ninguna señal de alerta."
  - idea: "La política es el primer bloque del programa y tiene una estructura conocida."
    application: "La política se genera con sus 10 secciones, del propósito al glosario."
  - idea: "El avance se sigue con un cuadro de mando corporativo y por dominio, en verde, amarillo o rojo."
    application: "El EDG Scorecard calcula cada métrica a partir del estado real de cada dominio y sus sistemas."

takeaways:
  - "Hoy los pasivos de datos de NovaMercado pesan más que sus activos: la data equity es negativa."
  - "Presentar tres opciones demuestra que se han tenido en cuenta las expectativas de la dirección, aunque se recomiende una."
  - "El scorecard ya señala las primeras conversaciones: dominios sin ejecutivo y sistemas sin owner."

challenges:
  - title: Cuenta también los beneficios sin validar
    steps:
      - "En Entradas → Caso de negocio, activa «Incluir beneficios sin validar» y guarda."
      - "Vuelve a ejecutar la lección."
    look_for: "Sube el beneficio anual y con él el VAN de todas las opciones. ¿Defenderías esa cifra ante el CFO sin que el negocio la haya validado?"
  - title: Haz que la visión falle la revisión
    steps:
      - "En Entradas → Programa, añade la palabra «pipeline» o «metadatos» a la declaración de la visión."
      - "Ejecuta de nuevo y mira el resumen."
    look_for: "Aparece el aviso de jerga de datos. Reescríbela para que la entienda cualquier persona del comité."
  - title: Cambia de opinión sobre el lanzamiento
    steps:
      - "En Entradas → Programa, marca como presente alguna señal de alerta."
      - "Ejecuta de nuevo."
    look_for: "La decisión pasa a «esperar» y el motivo nombra la señal. ¿Qué harías para mitigarla?"
  - title: Encarece el dinero
    steps:
      - "En Entradas → Caso de negocio, sube la tasa de descuento de 0,08 a 0,20."
      - "Ejecuta de nuevo y compara el VAN y la recomendación."
    look_for: "Las opciones que tardan más en dar valor pierden más VAN. Si la recomendada deja de ser la de mayor VAN, la lección te avisa."

