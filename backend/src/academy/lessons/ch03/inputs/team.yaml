      levels: {Gobierno de datos: 0, Gestión de metadatos: 1, Calidad de datos: 2, Datos maestros (MDM): 0, Modelado de datos: 1, Ingeniería de datos: 1, Product management: 0, Privacidad y seguridad: 0, Comunicación con negocio: 2}

