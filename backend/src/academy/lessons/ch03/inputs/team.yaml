      role: de_leader
      levels: {Gobierno de datos: 1, Gestión de metadatos: 2, Calidad de datos: 2, Datos maestros (MDM): 1, Modelado de datos: 3, Ingeniería de datos: 4, Product management: 1, Privacidad y seguridad: 2, Comunicación con negocio: 2}
    - name: Ingeniera de datos A
      role: data_engineers
      levels: {Gobierno de datos: 0, Gestión de metadatos: 1, Calidad de datos: 2, Datos maestros (MDM): 0, Modelado de datos: 2, Ingeniería de datos: 3, Product management: 0, Privacidad y seguridad: 1, Comunicación con negocio: 1}
    - name: Ingeniero de datos B
      role: data_engineers
      levels: {Gobierno de datos: 0, Gestión de metadatos: 2, Calidad de datos: 1, Datos maestros (MDM): 1, Modelado de datos: 2, Ingeniería de datos: 3, Product management: 0, Privacidad y seguridad: 1, Comunicación con negocio: 1}
    - name: Líder de analítica
      role: analytics_leader
      levels: {Gobierno de datos: 1, Gestión de metadatos: 1, Calidad de datos: 2, Datos maestros (MDM): 0, Modelado de datos: 2, Ingeniería de datos: 1, Product management: 2, Privacidad y seguridad: 1, Comunicación con negocio: 3}
