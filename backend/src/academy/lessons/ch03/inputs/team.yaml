    Gobierno de datos: 3
    Gestión de metadatos: 3
    Calidad de datos: 3
    Datos maestros (MDM): 3
    Modelado de datos: 3
    Ingeniería de datos: 3
    Product management: 2
    Privacidad y seguridad: 2
    Comunicación con negocio: 3
  members:
    - name: CDAO
      role: cdao
      levels: {Gobierno de datos: 3, Gestión de metadatos: 2, Calidad de datos: 2, Datos maestros (MDM): 1, Modelado de datos: 2, Ingeniería de datos: 1, Product management: 3, Privacidad y seguridad: 2, Comunicación con negocio: 4}
