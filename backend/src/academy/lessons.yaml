# Catálogo de lecciones: una por capítulo de *Data Governance Handbook* (W. S. Batchelder,
# Packt 2024). Los resúmenes son propios: el libro no se reproduce, solo se referencia.
# `recommended` son las lecciones que conviene completar antes; no bloquean el acceso.
# `status`: available (lección interactiva lista) o planned (pendiente de migrar del laboratorio).

parts:
  1: Diseñar el camino hacia datos confiables
  2: Las capacidades de gobierno de datos en profundidad
  3: Generar confianza con entregas basadas en valor
  4: Caso de estudio

